        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # DEM 下载器（独立 Python 服务 127.0.0.1:8081，相对路径前端）
    location = /dem { return 308 /dem/; }

    location /dem/ {
        proxy_pass http://127.0.0.1:8081/;
