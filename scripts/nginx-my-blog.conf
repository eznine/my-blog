    }

    location /uploads/ {
        alias /srv/my-blog/public/uploads/;
        expires 7d;
    }

    location /content-images/ {
        alias /srv/my-blog/public/content-images/;
        expires 30d;
    }

    location /demos/ {
        alias /srv/my-blog/public/demos/;
        expires 7d;
    }

    location /code/ {
        alias /srv/my-blog/public/code/;
        expires 7d;
    }
}
